<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVA AI — English Only, Instant Answers</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      font-family: 'Segoe UI', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .app {
      width: 800px;
      max-width: 95vw;
      height: 90vh;
      background: #13131a;
      border-radius: 28px;
      border: 1px solid #2a2a3a;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      padding: 20px;
      font-size: 28px;
      font-weight: bold;
      background: linear-gradient(135deg, #e8e8f0, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      border-bottom: 1px solid #2a2a3a;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      display: flex;
      gap: 10px;
    }
    .user { justify-content: flex-end; }
    .user .bubble {
      background: #1e1a3a;
      border: 1px solid #7c6af7;
    }
    .ai .bubble {
      background: #141420;
      border: 1px solid #2a2a3a;
    }
    .bubble {
      max-width: 75%;
      padding: 10px 16px;
      border-radius: 18px;
      color: white;
      line-height: 1.5;
      font-size: 14px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .input-area {
      padding: 16px;
      border-top: 1px solid #2a2a3a;
      display: flex;
      gap: 10px;
    }
    textarea {
      flex: 1;
      background: #1c1c27;
      border: 1px solid #2a2a3a;
      border-radius: 24px;
      padding: 10px 16px;
      color: white;
      font-family: monospace;
      resize: none;
    }
    button {
      background: #7c6af7;
      border: none;
      border-radius: 40px;
      padding: 0 20px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .status {
      padding: 8px;
      text-align: center;
      font-size: 12px;
      color: #aaa;
      background: #0a0a0f;
    }
  </style>
</head>
<body>
<div class="app">
  <header>✦ NOVA — English only · No delays · No refusals</header>
  <div id="chat">
    <div class="message ai"><div class="bubble">⚡ I'm NOVA. I only speak English. Ask me anything and I'll reply in clear English instantly.</div></div>
  </div>
  <div class="input-area">
    <textarea id="userInput" rows="1" placeholder="Ask anything in English..."></textarea>
    <button id="sendBtn">Send</button>
  </div>
  <div class="status" id="status">✅ Ready — using Groq (English forced)</div>
</div>

<script>
  // Your API key
  const GROQ_API_KEY = "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";

  const chatDiv = document.getElementById('chat');
  const input = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const statusDiv = document.getElementById('status');

  function appendMessage(role, text) {
    const msgDiv = document.createElement('div');
    msgDiv.className = `message ${role}`;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerText = text;
    msgDiv.appendChild(bubble);
    chatDiv.appendChild(msgDiv);
    chatDiv.scrollTop = chatDiv.scrollHeight;
  }

  // Simple check if text looks like English (no excessive diacritics or non-ASCII)
  function isMostlyEnglish(text) {
    const nonAscii = text.match(/[^\x00-\x7F]/g);
    if (!nonAscii) return true;
    // If more than 10% of characters are non-ASCII, flag it
    return (nonAscii.length / text.length) < 0.1;
  }

  async function sendMessage() {
    const userText = input.value.trim();
    if (!userText) return;
    input.value = '';
    appendMessage('user', userText);
    statusDiv.innerText = '⚡ thinking...';

    try {
      const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${GROQ_API_KEY}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          model: 'llama-3.3-70b-versatile',
          messages: [
            { 
              role: 'system', 
              content: 'You are NOVA. Always answer directly and instantly in English. Use only English letters A-Z. Never use Dutch, German, French, Spanish, or any other language. Even if the user asks in another language, you must reply in English. Never refuse to answer.' 
            },
            { role: 'user', content: userText }
          ],
          temperature: 0.3,  // lower temperature = more consistent English
          max_tokens: 600
        })
      });

      if (!response.ok) {
        const errorText = await response.text();
        throw new Error(`API error ${response.status}: ${errorText}`);
      }

      const data = await response.json();
      let reply = data.choices[0].message.content;

      // If reply has too many non-English characters, add a warning and ask to retry
      if (!isMostlyEnglish(reply)) {
        reply = "[NOVA detected non-English text. I'll retry in English.]\n\n" + reply;
        // Optionally, you could re-prompt the AI here, but let's keep it simple.
      }

      appendMessage('ai', reply);
      statusDiv.innerText = '✅ ready';
    } catch (err) {
      console.error(err);
      appendMessage('ai', `❌ Error: ${err.message}`);
      statusDiv.innerText = '⚠️ error';
    }
  }

  sendBtn.onclick = sendMessage;
  input.addEventListener('keypress', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
</script>
</body>
</html>
